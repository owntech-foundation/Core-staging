# Build tier of the API regression suite (GitHub-hosted, no bench), next to the example builds (examples.yml):
# - api-compile: tests/firmware/api_compile calls every public call of the user-facing API; it is built and linked in
#   the none, twist and ownverter shield configurations,
#   plus twist130 (Twist 1.3.0 + usart1) for shield.ngnd and spin.uart.
#   Then the negative checks (tools/build_api_negative.sh): a setting the shield cannot support (the UART API without
#   usart1, ThingSet CAN on Twist 1.3.0) must stop the build with a message naming it.
# - docs-calls: every API call written in docs/*.md names a public call declared in the headers.
name: API build tier

on:
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!tests/**'
      - 'tests/firmware/**'
      - 'docs/**'
  push:
    branches: [main]
    paths:
      - '**'
      - '!**.md'
      - '!tests/**'
      - 'tests/firmware/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'owntech/pio_extra.ini', 'west.yml') }}
      - name: Install PlatformIO
        run: python -m pip install -U platformio
      - name: Build every public call (none, twist, ownverter, twist130)
        run: tools/build_api_compile.sh api-compile
      - name: Negative checks (unsupported shield settings stop with a clear message)
        if: success() || failure()
        run: tools/build_api_negative.sh api-compile
      - name: Summary
        if: always()
        run: cat api-compile/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-compile-logs
          path: api-compile/

  docs-calls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Every API call in docs/*.md exists
        run: python3 tools/api_calls.py docs docs --summary "$GITHUB_STEP_SUMMARY"
