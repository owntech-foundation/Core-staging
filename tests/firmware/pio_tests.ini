board_build.zephyr.cmake_extra_args = -DBUILD_ENV_NAME=APIC_TWIST130 -DOWNTECH_APP_DIR=tests/firmware/api_compile/twist130
build_src_filter = -<*> +<../tests/firmware/api_compile/twist130/>
extra_scripts = ${env:SMOKE.extra_scripts}

[env:APIC_OWNVERTER]
extends = bootloader
board_shield = ownverter
board_shield_version = 1_1_0
board_build.zephyr.cmake_extra_args = -DBUILD_ENV_NAME=APIC_OWNVERTER -DOWNTECH_APP_DIR=tests/firmware/api_compile
build_src_filter = -<*> +<../tests/firmware/api_compile/main.cpp>
extra_scripts = ${env:SMOKE.extra_scripts}

# APIC_NEG_*: negative build checks (tools/build_api_negative.sh): a setting the shield cannot support. Each is
# expected to stop at configure time with a message naming the option and the missing device-tree node.
[env:APIC_NEG_UART]
extends = bootloader
board_shield = twist
board_shield_version = 1_4_2
board_build.zephyr.cmake_extra_args = -DBUILD_ENV_NAME=APIC_NEG_UART -DOWNTECH_APP_DIR=tests/firmware/api_compile/negative/uart_twist142
build_src_filter = -<*> +<../tests/firmware/api_compile/negative/uart_twist142/>
extra_scripts = ${env:SMOKE.extra_scripts}

[env:APIC_NEG_CAN]
