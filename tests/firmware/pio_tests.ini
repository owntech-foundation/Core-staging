board_build.zephyr.cmake_extra_args = -DBUILD_ENV_NAME=APIC_NEG_CAN -DOWNTECH_APP_DIR=tests/firmware/api_compile/negative/can_twist130
build_src_filter = -<*> +<../tests/firmware/api_compile/negative/can_twist130/>
extra_scripts = ${env:SMOKE.extra_scripts}
# HRI: an up-down PWMA (200 kHz, duty 0.5, started on PA8/PA9) initialised again at the host's request
# (tests/l0/target_hrtim_reinit, Core#172). Drives PWMA: only on a bare Spin such as the SPOC CUT, never on a power stage.
[env:HRI]
extends = bootloader
board_shield =
board_shield_version =
board_build.zephyr.cmake_extra_args = -DBUILD_ENV_NAME=HRI -DOWNTECH_APP_DIR=tests/firmware/hrtim_reinit
build_src_filter = -<*> +<../tests/firmware/hrtim_reinit/>
upload_protocol = custom
upload_command = ${env:SMOKE.upload_command}
extra_scripts = ${env:SMOKE.extra_scripts}
