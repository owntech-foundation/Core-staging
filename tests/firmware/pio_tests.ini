# Test firmware environments: never for a power board running a converter.
#
# Each env builds an app folder under tests/firmware/ instead of src/
# (build_src_filter for the sources, OWNTECH_APP_DIR for app.conf and
# app.overlay) and flashes it through an ST-Link with PlatformIO's OpenOCD into
# the MCUboot slot; the bootloader already on the board is kept.
# tests/common/target_harness.py builds and flashes them, then restores the
# BOARD/SHIELD lines of zephyr/CMakeLists.txt (tools/restore_board_lines.py).

# SMOKE: build -> flash -> SWD read, on any Spin (tests/l0/target_smoke).
# No shield and no outputs driven: safe on a Spin mounted on a power stage.
[env:SMOKE]
extends = bootloader
board_shield =
board_shield_version =
board_build.zephyr.cmake_extra_args = -DBUILD_ENV_NAME=SMOKE -DOWNTECH_APP_DIR=tests/firmware/smoke
build_src_filter = -<*> +<../tests/firmware/smoke/>
upload_protocol = custom
upload_command = ${platformio.packages_dir}/tool-openocd/bin/openocd -d1 -s ${platformio.packages_dir}/tool-openocd/openocd/scripts -f interface/stlink.cfg -f target/stm32g4x.cfg -c "program $SOURCE 0x8047800 verify reset exit"
extra_scripts =
    pre:owntech/scripts/pre_bootloader_common.py
    pre:owntech/scripts/pre_usb.py
    pre:owntech/scripts/pre_version.py

# CTK: task.createCritical() at host-set periods on HRTIM (200 kHz, unit A initialised, no output started) or TIM6;
# the critical task toggles PA6 (tests/l0/target_critical_task). Safe on a bare Spin.
[env:CTK]
extends = bootloader
board_shield =
board_shield_version =
board_build.zephyr.cmake_extra_args = -DBUILD_ENV_NAME=CTK -DOWNTECH_APP_DIR=tests/firmware/critical_task
build_src_filter = -<*> +<../tests/firmware/critical_task/>
upload_protocol = custom
upload_command = ${env:SMOKE.upload_command}
extra_scripts = ${env:SMOKE.extra_scripts}

# DAC: the analog communication bus's DAC (DAC2 ch1, PA6) at host-set levels (tests/l0/target_dac).
# Shield config twist (inherited) for ANALOG_COMM; no PWM started: safe on a bare Spin.
[env:DAC]
extends = bootloader
board_build.zephyr.cmake_extra_args = -DBUILD_ENV_NAME=DAC -DOWNTECH_APP_DIR=tests/firmware/dac
build_src_filter = -<*> +<../tests/firmware/dac/>
upload_protocol = custom
upload_command = ${env:SMOKE.upload_command}
extra_scripts = ${env:SMOKE.extra_scripts}

# ADD: ADC data dispatch under a critical task (tests/l0/target_data_dispatch). Starts PWMA (PA8/PA9 toggle at
# 200 kHz): only on a bare Spin such as the SPOC CUT, never on a power stage.
[env:ADD]
extends = bootloader
board_shield =
board_shield_version =
board_build.zephyr.cmake_extra_args = -DBUILD_ENV_NAME=ADD -DOWNTECH_APP_DIR=tests/firmware/data_dispatch
build_src_filter = -<*> +<../tests/firmware/data_dispatch/>
upload_protocol = custom
upload_command = ${env:SMOKE.upload_command}
extra_scripts = ${env:SMOKE.extra_scripts}

# TIM: cost of the Core API hot-path calls and critical-task timing, DWT cycles into a RAM report (tests/l0/target_timing).
# Starts PWMA (PA8/PA9 toggle at 200 kHz) and drives PA6 as a marker: only on a bare Spin such as the SPOC CUT.
[env:TIM]
extends = bootloader
board_shield =
board_shield_version =
board_build.zephyr.cmake_extra_args = -DBUILD_ENV_NAME=TIM -DOWNTECH_APP_DIR=tests/firmware/timing
build_src_filter = -<*> +<../tests/firmware/timing/>
upload_protocol = custom
upload_command = ${env:SMOKE.upload_command}
extra_scripts = ${env:SMOKE.extra_scripts}

# PAD: DataAPI pin-to-ADC resolution on every Spin pin (tests/l0/target_data_pins, Core-staging#50). No shield,
# no PWM; ADC acquisition only (pins read, never driven): safe on a bare Spin.
[env:PAD]
extends = bootloader
board_shield =
board_shield_version =
board_build.zephyr.cmake_extra_args = -DBUILD_ENV_NAME=PAD -DOWNTECH_APP_DIR=tests/firmware/data_pins
build_src_filter = -<*> +<../tests/firmware/data_pins/>
upload_protocol = custom
upload_command = ${env:SMOKE.upload_command}
extra_scripts = ${env:SMOKE.extra_scripts}

# SAF: the Safety error thread's report when one channel trips (tests/l0/target_safety_report, Core-staging#47).
# Shield config twist (inherited) for the Safety API and its error thread; ADC1/ADC2 software-triggered from a TIM6
# critical task, no PWM started. A trip drives the leg GPIOs low (open circuit): only on a bare Spin such as the SPOC
# CUT, never on a power stage.
[env:SAF]
extends = bootloader
board_build.zephyr.cmake_extra_args = -DBUILD_ENV_NAME=SAF -DOWNTECH_APP_DIR=tests/firmware/safety_report
build_src_filter = -<*> +<../tests/firmware/safety_report/>
upload_protocol = custom
upload_command = ${env:SMOKE.upload_command}
extra_scripts = ${env:SMOKE.extra_scripts}

# PWM: the PWM module of the API regression suite (tests/l0/target_pwm, Core-staging#38): a step executor over
# spin.pwm commanded over SWD. Starts outputs of all six HRTIM units and drives PA6 as a marker: only on a bare Spin
# such as the SPOC CUT, never on a power stage.
[env:PWM]
extends = bootloader
board_shield =
board_shield_version =
board_build.zephyr.cmake_extra_args = -DBUILD_ENV_NAME=PWM -DOWNTECH_APP_DIR=tests/firmware/pwm
build_src_filter = -<*> +<../tests/firmware/pwm/>
upload_protocol = custom
upload_command = ${env:SMOKE.upload_command}
extra_scripts = ${env:SMOKE.extra_scripts}

# APIC_*: build tier of the API regression suite (tests/firmware/api_compile, .github/workflows/api-build.yml).
# Every public call compiled and linked in one shield configuration; build only, never flashed (main() does nothing).
# APIC_TWIST130: Twist 1.3.0, the newest Twist with the NGND switch (shield.ngnd), plus usart1 from its app.overlay
# (spin.uart); its own app folder tests/firmware/api_compile/twist130 includes the shared main.cpp.
[env:APIC_NONE]
extends = bootloader
board_shield =
board_shield_version =
board_build.zephyr.cmake_extra_args = -DBUILD_ENV_NAME=APIC_NONE -DOWNTECH_APP_DIR=tests/firmware/api_compile
build_src_filter = -<*> +<../tests/firmware/api_compile/main.cpp>
extra_scripts = ${env:SMOKE.extra_scripts}

[env:APIC_TWIST]
extends = bootloader
board_shield = twist
board_shield_version = 1_4_2
board_build.zephyr.cmake_extra_args = -DBUILD_ENV_NAME=APIC_TWIST -DOWNTECH_APP_DIR=tests/firmware/api_compile
build_src_filter = -<*> +<../tests/firmware/api_compile/main.cpp>
extra_scripts = ${env:SMOKE.extra_scripts}

[env:APIC_TWIST130]
