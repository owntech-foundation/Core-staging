# L0-TKD (tests/firmware/task_data): the heap probe reads the system heap's allocated bytes (Core-staging#56: the
# DataAPI hot-path calls must not allocate).
CONFIG_SYS_HEAP_RUNTIME_STATS=y
# DataAPI start() allocates conversion parameters for every channel, DMA and dispatch buffers: room for them.
CONFIG_HEAP_MEM_POOL_SIZE=16384
