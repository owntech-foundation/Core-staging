# Negative build check (env APIC_NEG_CAN, tools/build_api_negative.sh): ThingSet over CAN on Twist 1.3.0, whose
# device tree has no enabled `thingset,can` chosen node. The build must stop at configure time with a message naming
# CONFIG_OWNTECH_COMMUNICATION_ENABLE_CAN and the missing node, instead of a `__device_dts_ord_N` undeclared error at
# compile time.
CONFIG_OWNTECH_COMMUNICATION=y
CONFIG_OWNTECH_COMMUNICATION_ENABLE_CAN=y
