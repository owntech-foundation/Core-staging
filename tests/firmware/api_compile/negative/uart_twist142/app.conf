# Negative build check (env APIC_NEG_UART, tools/build_api_negative.sh): the UART API on Twist 1.4.2, whose device
# tree has no usart1. The build must stop at configure time with a message naming CONFIG_OWNTECH_UART_API and the
# missing usart1, instead of a `__device_dts_ord_N` undeclared error at compile time.
CONFIG_OWNTECH_UART_API=y
