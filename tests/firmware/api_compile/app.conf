# Build tier (tests/firmware/api_compile): enable every optional user-facing API so that all its calls compile.
# spin.uart and shield.ngnd follow the shield (its .conf): only a shield with usart1 / the NGND switch has them.
# Symbols whose dependencies a configuration lacks (communication without a shield) stay off there, and main.cpp
# guards their calls with the same symbols.
CONFIG_OWNTECH_COMMUNICATION=y
CONFIG_OWNTECH_COMMUNICATION_ENABLE_CAN=y
CONFIG_THINGSET_SUBSET_LIVE_METRICS=y
CONFIG_THINGSET_CAN_CONTROL_REPORTING=y
CONFIG_THINGSET_CAN_CONTROL_SUBSET=0x8
