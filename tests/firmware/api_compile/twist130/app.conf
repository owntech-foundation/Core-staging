# Build tier, Twist 1.3.0 configuration (env APIC_TWIST130): the shared main.cpp one folder up, on the newest Twist
# with the NGND switch (shield.ngnd), with usart1 enabled by app.overlay so that spin.uart compiles too. On the
# shipped shields only the O2 enables usart1, and the O2 does not build on staging (see ../known_failures.txt).
# CAN stays off: Twist 1.3.0's device tree has no `thingset,can` chosen node, which the ThingSet SDK needs
# (communication.can is built in the twist and ownverter configurations).
CONFIG_OWNTECH_UART_API=y
